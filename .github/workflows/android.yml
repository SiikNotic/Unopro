name: Android app (APK)

# Builds the Android app (the same web build inside Capacitor, with AdMob rewarded ads).
#
# Public values, from repository Variables:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  (as for the web build)
#   ADMOB_APP_ID           e.g. ca-app-pub-1234567890123456~1234567890   (unset: Google's test app)
#   VITE_ADMOB_REWARDED_ID e.g. ca-app-pub-1234567890123456/1234567890   (unset: Google's test ad unit)
# Secrets (the release signing key; never in the repository):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
#
# With the signing key, every push to the default branch that changes the app publishes a new version as a
# GitHub Release (carta.apk + update.json with its SHA-256), at the same time as the web deploy; installed
# apps find it and offer to update. The version is app-release.json's base version plus this workflow's run
# number (1.2.0 + run 37 = 1.2.37, versionCode 10237), so it always goes up. Without the key, only a debug
# APK is built (as a run artifact).
on:
  push:
    branches: ['**']
    paths: ['android/**', 'src/**', 'app-release.json', 'capacitor.config.ts', 'package.json', 'package-lock.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Version (base in app-release.json + run number)
        id: v
        env:
          RUN: ${{ github.run_number }}
        run: |
          # versionCode = major*10000 + minor*100 + patch (the formula installed apps check); written back into
          # app-release.json so the bundled app knows its own version and notes.
          node -e '
            const fs = require("fs");
            const r = require("./app-release.json");
            const [a, b, c] = r.version.split(".").map(Number);
            const code = a * 10000 + b * 100 + c + Number(process.env.RUN);
            const name = `${Math.floor(code / 10000)}.${Math.floor(code / 100) % 100}.${code % 100}`;
            if (Math.floor(code / 10000) !== a) throw new Error("minor version overflow: raise the base version");
            fs.writeFileSync("app-release.json", JSON.stringify({ ...r, version: name }, null, 2) + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${name}\ncode=${code}\n`);
            console.log(`Carta ${name} (versionCode ${code})`);
          '
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_ADMOB_REWARDED_ID: ${{ vars.VITE_ADMOB_REWARDED_ID }}
      - run: npx cap sync android
      - name: Signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key: building a debug APK only."
          fi
      - name: Build signed release APK
        if: steps.key.outputs.file != ''
        working-directory: android
        run: ./gradlew assembleDirectRelease --no-daemon
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          APP_VERSION_NAME: ${{ steps.v.outputs.name }}
          APP_VERSION_CODE: ${{ steps.v.outputs.code }}
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Build debug APK
        if: steps.key.outputs.file == ''
        working-directory: android
        run: ./gradlew assembleDirectDebug --no-daemon
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          APP_VERSION_NAME: ${{ steps.v.outputs.name }}
          APP_VERSION_CODE: ${{ steps.v.outputs.code }}
      - name: Collect APK
        run: |
          if [ -f android/app/build/outputs/apk/direct/release/app-direct-release.apk ]; then cp android/app/build/outputs/apk/direct/release/app-direct-release.apk carta.apk
          else cp android/app/build/outputs/apk/direct/debug/app-direct-debug.apk carta.apk; fi
          sha256sum carta.apk
      - uses: actions/upload-artifact@v5
        with:
          name: carta-apk
          path: carta.apk
          retention-days: 30
      - name: Publish the version (only when it is new)
        if: steps.key.outputs.file != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.v.outputs.name }}
          CODE: ${{ steps.v.outputs.code }}
          REPO: ${{ github.repository }}
        run: |
          TAG="v$NAME"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "$TAG is already published (a re-run): nothing to do."
            exit 0
          fi
          SHA=$(sha256sum carta.apk | cut -d' ' -f1)
          node -e '
            const r = require("./app-release.json");
            const fs = require("fs");
            const url = `https://github.com/${process.env.REPO}/releases/download/v${r.version}/carta.apk`;
            fs.writeFileSync("update.json", JSON.stringify({ versionCode: Number(process.env.CODE), versionName: r.version, notes: r.notes, apkUrl: url, sha256: process.argv[1] }, null, 2));
            fs.writeFileSync("notes.md", r.notes.es.map((n) => `- ${n}`).join("\n") + "\n\n**English**\n\n" + r.notes.en.map((n) => `- ${n}`).join("\n") + `\n\nSHA-256: \`${process.argv[1]}\`\n`);
          ' "$SHA"
          cat update.json
          gh release create "$TAG" carta.apk update.json --repo "$REPO" --title "Carta $NAME" --notes-file notes.md --target "$GITHUB_SHA"

  play-bundle:
    # The Google Play bundle (.aab): same app, built with VITE_DISTRIBUTION=play and the "play" flavor (no
    # self-update, no REQUEST_INSTALL_PACKAGES). Only kept as a run artifact — nothing is sent to Google.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_ADMOB_REWARDED_ID: ${{ vars.VITE_ADMOB_REWARDED_ID }}
          VITE_DISTRIBUTION: play
      - run: npx cap sync android
      - name: Signing key (upload key)
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"; fi
      - name: Build the Play bundle
        working-directory: android
        run: ./gradlew bundlePlayRelease --no-daemon
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          APP_VERSION_NAME: '1.0'
          APP_VERSION_CODE: '1'
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Check the bundle has no install-packages permission
        run: |
          AAB=android/app/build/outputs/bundle/playRelease/app-play-release.aab
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -q REQUEST_INSTALL_PACKAGES && { echo "REQUEST_INSTALL_PACKAGES found"; exit 1; } || echo "OK: no REQUEST_INSTALL_PACKAGES"
      - uses: actions/upload-artifact@v5
        with:
          name: carta-play-aab
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          retention-days: 30

  ssv-smoke:
    # The deployed AdMob verification endpoint must refuse anything not signed by Google. Also proves it can
    # download and read Google's public keys (an unknown key id answers 403, not 500).
    runs-on: ubuntu-latest
    if: vars.VITE_SUPABASE_URL != ''
    steps:
      - name: Forged requests are refused
        env:
          BASE: ${{ vars.VITE_SUPABASE_URL }}/functions/v1/admob-ssv
        run: |
          set -u
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          check() { echo "$1 -> $2 (expected $3)"; [ "$2" = "$3" ] || exit 1; }
          check "no query" "$(code "$BASE")" 400
          check "POST" "$(code -X POST "$BASE")" 405
          check "unknown key" "$(code "$BASE?ad_unit=1&transaction_id=t&user_id=00000000-0000-4000-8000-000000000000&signature=MEUCIQ&key_id=1")" 403
          KEY=$(curl -s https://www.gstatic.com/admob/reward/verifier-keys.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["keys"][0]["keyId"])')
          check "bad signature, real key $KEY" "$(code "$BASE?ad_unit=1&transaction_id=t&user_id=00000000-0000-4000-8000-000000000000&signature=MEUCIQDw&key_id=$KEY")" 400
