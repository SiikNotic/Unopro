# Weekly dependency updates (security fixes arrive as soon as they're published). Pull requests only:
# nothing is merged without review and a green CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # Tailwind 4 needs Chrome 111+ / Safari 16.4+: older Android WebViews (the APK) would break. Stay on 3.
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      # TypeScript 7 is not supported by typescript-eslint yet (it accepts up to 6.0).
      - dependency-name: typescript
        versions: ['>=7']
      # Node's types follow the Node version the app and CI run on (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
